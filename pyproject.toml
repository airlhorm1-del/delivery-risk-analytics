[project]
name = "delivery-risk-analytics"
version = "0.1.0"
description = "E-commerce delivery reliability and revenue-at-risk analytics: Python + BigQuery + dbt + Power BI."
readme = "README.md"
# dbt and the Google Cloud libraries lag the newest Python release, so stay on 3.12.
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbt-bigquery>=1.12.1",
    "dbt-core>=1.12.5",
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.6",
    "google-cloud-bigquery>=3.45.2",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# The formatter keeps code within the line length; long SQL and Markdown text inside strings is fine.
ignore = ["E501"]
